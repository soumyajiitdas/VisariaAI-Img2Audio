# Render configuration for VisariaAI Backend
services:
  - type: web
    name: visaria-ai-backend
    env: python
    region: oregon  # Choose region closest to your users
    plan: free  # Change to 'starter' for always-on service
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/
    envVars:
      - key: MONGO_URL
        value: your_mongodb_atlas_connection_string
      - key: DB_NAME  
        value: visaria_ai
      - key: CORS_ORIGINS
        value: https://visaria-ai.vercel.app